name: Mybot Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle | sed 's/[^0-9]*//g')
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          # Use multiline output for commit message (safe for special chars)
          {
            echo "commit_msg<<EOF_MSG"
            echo "$COMMIT_MSG"
            echo "EOF_MSG"
          } >> "$GITHUB_OUTPUT"
          echo "### Build Info" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| App Version | v${VERSION_NAME} (code ${VERSION_CODE}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Message | ${COMMIT_MSG} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore debug keystore from secret
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Print debug keystore SHA-1
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep -E "SHA1|SHA-1" | head -1
          echo "### Signing Info" >> "$GITHUB_STEP_SUMMARY"
          SHA1=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep -E "SHA1|SHA-1" | head -1 | sed 's/.*: //')
          echo "| SHA-1 | \`${SHA1}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | com.mybot.app |" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.5.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Get APK size
        id: apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "size=$SIZE" >> "$GITHUB_OUTPUT"
            echo "### Build Result" >> "$GITHUB_STEP_SUMMARY"
            echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Status | Success |" >> "$GITHUB_STEP_SUMMARY"
            echo "| APK Size | ${SIZE}B |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Artifact | mybot-v${{ steps.version.outputs.name }}-debug.apk |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mybot-v${{ steps.version.outputs.name }}-build${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-c${{ steps.version.outputs.code }}
          name: Mybot v${{ steps.version.outputs.name }}
          body: |
            ${{ steps.version.outputs.commit_msg }}

            **Version**: v${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }})
            **Build**: #${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
