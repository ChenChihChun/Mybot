<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2048</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0F1923;
  color: #ECEFF1;
  font-family: -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 16px;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(92vw, 400px);
  margin-bottom: 12px;
}
.scores {
  display: flex;
  gap: 12px;
}
.score-box {
  background: #1A2733;
  border-radius: 8px;
  padding: 6px 16px;
  text-align: center;
  min-width: 72px;
}
.score-box .label {
  color: #90A4AE;
  font-size: 11px;
  text-transform: uppercase;
}
.score-box .value {
  color: #4FC3F7;
  font-size: 22px;
  font-weight: bold;
}
.btn-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
button.action {
  background: #1A2733;
  color: #4FC3F7;
  border: 1px solid #4FC3F7;
  border-radius: 10px;
  padding: 8px 18px;
  font-size: 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button.action:active { background: #263540; }
#board {
  position: relative;
  width: min(92vw, 400px);
  height: min(92vw, 400px);
  background: #1A2733;
  border-radius: 12px;
  padding: 8px;
}
.cell-bg {
  position: absolute;
  background: #263540;
  border-radius: 8px;
}
.tile {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-weight: bold;
  transition: top 0.12s ease, left 0.12s ease;
  z-index: 1;
}
.tile.new { animation: pop 0.2s ease; }
.tile.merged { animation: pulse 0.2s ease; z-index: 2; }
@keyframes pop {
  0% { transform: scale(0); }
  70% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 25, 35, 0.75);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  z-index: 10;
}
.overlay h2 { font-size: 36px; margin-bottom: 16px; }
.overlay .win { color: #FFD54F; }
.overlay .lose { color: #EF5350; }
.overlay button {
  background: #4FC3F7;
  color: #0F1923;
  border: none;
  border-radius: 10px;
  padding: 10px 28px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}
.stats-row {
  display: flex;
  gap: 24px;
  margin-top: 16px;
  font-size: 14px;
  color: #90A4AE;
}
.stats-row strong { color: #4FC3F7; }
</style>
</head>
<body>

<div class="header">
  <div class="scores">
    <div class="score-box">
      <div class="label">分數</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="label">最高分</div>
      <div class="value" id="best">0</div>
    </div>
  </div>
</div>
<div class="btn-row">
  <button class="action" onclick="newGame()">新遊戲</button>
  <button class="action" onclick="undoMove()">↩ 復原</button>
</div>
<div id="board"></div>
<div class="stats-row">
  <span>遊戲 <strong id="st-games">0</strong></span>
  <span>勝率 <strong id="st-winrate">0%</strong></span>
  <span>最大方塊 <strong id="st-maxtile">0</strong></span>
</div>

<script>
const SIZE = 4;
let grid, score, bestScore, prevState, won, over, keepPlaying;

// Tile colors
const TILE_COLORS = {
  2:    { bg: '#4FC3F7', fg: '#0F1923', size: 36 },
  4:    { bg: '#29B6F6', fg: '#0F1923', size: 36 },
  8:    { bg: '#FFA726', fg: '#FFFFFF', size: 36 },
  16:   { bg: '#FF7043', fg: '#FFFFFF', size: 34 },
  32:   { bg: '#EF5350', fg: '#FFFFFF', size: 34 },
  64:   { bg: '#EC407A', fg: '#FFFFFF', size: 34 },
  128:  { bg: '#AB47BC', fg: '#FFFFFF', size: 30 },
  256:  { bg: '#7E57C2', fg: '#FFFFFF', size: 30 },
  512:  { bg: '#5C6BC0', fg: '#FFFFFF', size: 30 },
  1024: { bg: '#FFD54F', fg: '#0F1923', size: 24 },
  2048: { bg: '#FFCA28', fg: '#0F1923', size: 24 },
  4096: { bg: '#26A69A', fg: '#FFFFFF', size: 22 },
  8192: { bg: '#66BB6A', fg: '#FFFFFF', size: 22 },
};
function tileStyle(v) {
  return TILE_COLORS[v] || { bg: '#78909C', fg: '#FFFFFF', size: 20 };
}

const board = document.getElementById('board');
let cellSize, gap, pad;

function calcSizes() {
  const bw = board.clientWidth;
  pad = 8;
  gap = 8;
  cellSize = (bw - pad * 2 - gap * (SIZE - 1)) / SIZE;
}

function cellPos(r, c) {
  return {
    top: pad + r * (cellSize + gap),
    left: pad + c * (cellSize + gap)
  };
}

function drawBackground() {
  board.querySelectorAll('.cell-bg').forEach(e => e.remove());
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const d = document.createElement('div');
      d.className = 'cell-bg';
      const p = cellPos(r, c);
      Object.assign(d.style, {
        top: p.top + 'px', left: p.left + 'px',
        width: cellSize + 'px', height: cellSize + 'px'
      });
      board.appendChild(d);
    }
  }
}

function drawTiles(newTiles, mergedTiles) {
  board.querySelectorAll('.tile').forEach(e => e.remove());
  board.querySelectorAll('.overlay').forEach(e => e.remove());
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = grid[r][c];
      if (!v) continue;
      const d = document.createElement('div');
      d.className = 'tile';
      const isNew = newTiles && newTiles.some(t => t[0] === r && t[1] === c);
      const isMerged = mergedTiles && mergedTiles.some(t => t[0] === r && t[1] === c);
      if (isNew) d.classList.add('new');
      if (isMerged) d.classList.add('merged');
      const s = tileStyle(v);
      const p = cellPos(r, c);
      Object.assign(d.style, {
        top: p.top + 'px', left: p.left + 'px',
        width: cellSize + 'px', height: cellSize + 'px',
        background: s.bg, color: s.fg, fontSize: s.size + 'px'
      });
      d.textContent = v;
      board.appendChild(d);
    }
  }

  // Overlays
  if (won && !keepPlaying) {
    showOverlay('🎉 2048!', 'win', ['繼續玩', '新遊戲'], [() => { keepPlaying = true; drawTiles(); }, newGame]);
  } else if (over) {
    showOverlay('遊戲結束', 'lose', ['再來一局'], [newGame]);
  }
}

function showOverlay(text, cls, btns, handlers) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  const h = document.createElement('h2');
  h.className = cls;
  h.textContent = text;
  ov.appendChild(h);
  btns.forEach((label, i) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = handlers[i];
    ov.appendChild(b);
  });
  board.appendChild(ov);
}

function emptyGrid() {
  return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
}

function addRandom() {
  const empty = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (!grid[r][c]) empty.push([r, c]);
  if (!empty.length) return null;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  return [r, c];
}

function canMove() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (!grid[r][c]) return true;
      if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
      if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
    }
  return false;
}

function maxTile() {
  let m = 0;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] > m) m = grid[r][c];
  return m;
}

function cloneGrid(g) { return g.map(r => [...r]); }

function slide(row) {
  let arr = row.filter(v => v);
  let merged = [];
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i + 1]) {
      arr[i] *= 2;
      score += arr[i];
      merged.push(arr[i]);
      arr.splice(i + 1, 1);
    }
  }
  while (arr.length < SIZE) arr.push(0);
  return { row: arr, merged };
}

function move(dir) {
  if (over || (won && !keepPlaying)) return false;

  prevState = { grid: cloneGrid(grid), score };

  let moved = false;
  let mergedTiles = [];

  if (dir === 'left' || dir === 'right') {
    for (let r = 0; r < SIZE; r++) {
      let row = [...grid[r]];
      if (dir === 'right') row.reverse();
      const res = slide(row);
      if (dir === 'right') res.row.reverse();
      if (res.row.some((v, i) => v !== grid[r][i])) moved = true;
      grid[r] = res.row;
      if (res.merged.length) {
        for (let c = 0; c < SIZE; c++) {
          if (res.merged.includes(grid[r][c])) {
            mergedTiles.push([r, c]);
            res.merged.splice(res.merged.indexOf(grid[r][c]), 1);
          }
        }
      }
    }
  } else {
    for (let c = 0; c < SIZE; c++) {
      let col = [];
      for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);
      if (dir === 'down') col.reverse();
      const res = slide(col);
      if (dir === 'down') res.row.reverse();
      if (res.row.some((v, i) => v !== grid[i][c])) moved = true;
      for (let r = 0; r < SIZE; r++) grid[r][c] = res.row[r];
      if (res.merged.length) {
        for (let r = 0; r < SIZE; r++) {
          if (res.merged.includes(grid[r][c])) {
            mergedTiles.push([r, c]);
            res.merged.splice(res.merged.indexOf(grid[r][c]), 1);
          }
        }
      }
    }
  }

  if (!moved) { prevState = null; return false; }

  const nt = addRandom();
  const newTiles = nt ? [nt] : [];

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('g2048_best', bestScore);
  }
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = bestScore;

  if (!won && maxTile() >= 2048) won = true;
  if (!canMove()) {
    over = true;
    saveStats(false);
  }

  drawTiles(newTiles, mergedTiles);
  saveGame();
  return true;
}

function undoMove() {
  if (!prevState) return;
  grid = prevState.grid;
  score = prevState.score;
  prevState = null;
  document.getElementById('score').textContent = score;
  over = false;
  drawTiles();
  saveGame();
}

function newGame() {
  grid = emptyGrid();
  score = 0;
  won = false;
  over = false;
  keepPlaying = false;
  prevState = null;
  addRandom();
  addRandom();
  document.getElementById('score').textContent = score;
  drawTiles(null, null);
  saveGame();
}

function saveGame() {
  localStorage.setItem('g2048_state', JSON.stringify({ grid, score, won, over, keepPlaying }));
}

function loadGame() {
  bestScore = parseInt(localStorage.getItem('g2048_best') || '0');
  document.getElementById('best').textContent = bestScore;
  try {
    const s = JSON.parse(localStorage.getItem('g2048_state'));
    if (s && s.grid) {
      grid = s.grid;
      score = s.score || 0;
      won = !!s.won;
      over = !!s.over;
      keepPlaying = !!s.keepPlaying;
      document.getElementById('score').textContent = score;
      drawTiles();
      return;
    }
  } catch(e) {}
  newGame();
}

function saveStats(isWin) {
  let stats = {};
  try { stats = JSON.parse(localStorage.getItem('g2048_stats') || '{}'); } catch(e) {}
  stats.games = (stats.games || 0) + 1;
  stats.wins = (stats.wins || 0) + (isWin ? 1 : 0);
  const mt = maxTile();
  if (mt > (stats.maxTile || 0)) stats.maxTile = mt;
  if (score > (stats.bestScore || 0)) stats.bestScore = score;
  localStorage.setItem('g2048_stats', JSON.stringify(stats));
  updateStatsUI(stats);
}

function updateStatsUI(stats) {
  if (!stats) {
    try { stats = JSON.parse(localStorage.getItem('g2048_stats') || '{}'); } catch(e) { stats = {}; }
  }
  document.getElementById('st-games').textContent = stats.games || 0;
  const wr = stats.games ? Math.round((stats.wins || 0) / stats.games * 100) : 0;
  document.getElementById('st-winrate').textContent = wr + '%';
  document.getElementById('st-maxtile').textContent = stats.maxTile || 0;
}

// Touch / swipe handling
let touchStartX, touchStartY;
const MIN_SWIPE = 30;

document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (touchStartX == null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = null;
  if (Math.abs(dx) < MIN_SWIPE && Math.abs(dy) < MIN_SWIPE) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? 'right' : 'left');
  } else {
    move(dy > 0 ? 'down' : 'up');
  }
});

// Keyboard support
document.addEventListener('keydown', e => {
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

// Handle win with stats
const origMove = move;
// Intercept 2048 win
(function() {
  const origAddRandom = addRandom;
  // We track win in move() already via won flag
})();

// Check win on continue-playing game over
const _origMove = move;

// Init
calcSizes();
drawBackground();
loadGame();
updateStatsUI();

window.addEventListener('resize', () => {
  calcSizes();
  drawBackground();
  drawTiles();
});
</script>
</body>
</html>
