<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>俄羅斯方塊 PK</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #0F1923; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

  /* ── Setup screen ── */
  #setup-screen {
    position: fixed; inset: 0; background: #0F1923;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  }
  #setup-screen h1 { color: #E0E0E0; font-size: 26px; letter-spacing: 2px; }
  #setup-hint { color: #4A6070; font-size: 12px; text-align: center; line-height: 1.6; }
  .diff-btn {
    width: 200px; padding: 14px 0; border-radius: 12px; border: none;
    font-size: 18px; font-weight: bold; cursor: pointer; letter-spacing: 1px;
    transition: transform 0.1s, opacity 0.1s;
  }
  .diff-btn:active { transform: scale(0.96); opacity: 0.85; }
  #btn-easy   { background: #4CAF50; color: #fff; }
  #btn-medium { background: #FF9800; color: #fff; }
  #btn-hard   { background: #F44336; color: #fff; }

  /* ── Game screen ── */
  #game-screen { display: none; flex-direction: column; height: 100%; }

  #scorebar {
    display: flex; justify-content: space-around; align-items: center;
    padding: 6px 8px; background: #162230; border-bottom: 1px solid #243040;
    flex-shrink: 0;
  }
  .score-block { text-align: center; }
  .score-label { font-size: 10px; color: #7A8FA0; letter-spacing: 1px; text-transform: uppercase; }
  .score-value { font-size: 18px; color: #E0E0E0; font-weight: bold; }
  #diff-badge {
    font-size: 11px; padding: 3px 10px; border-radius: 8px; font-weight: bold;
    background: #1E3040; color: #7AB8D8;
  }
  #ghost-toggle {
    font-size: 11px; padding: 3px 10px; border-radius: 8px; font-weight: bold;
    background: #1E3040; color: #7AB8D8; border: 1px solid #2A4A5A; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  #ghost-toggle.off { color: #4A5A68; border-color: #1E3040; }

  /* ── Boards area ── */
  #boards-area {
    flex: 1; display: flex; justify-content: center; align-items: center;
    gap: 16px; padding: 8px;
    overflow: hidden; position: relative; /* for swipe-zone */
  }
  .board-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .board-label { font-size: 12px; color: #8FA8BA; letter-spacing: 1px; }
  canvas { display: block; border: 2px solid #243040; border-radius: 4px; image-rendering: pixelated; }
  .next-wrap, .hold-wrap { font-size: 10px; color: #5A7080; text-align: center; margin-top: 2px; }
  .next-wrap canvas { margin-top: 1px; }
  .next-label, .hold-label { margin-bottom: 2px; }
  .hold-wrap.used { opacity: 0.4; }

  /* Transparent swipe capture layer */
  #swipe-zone {
    position: absolute; inset: 0; z-index: 10;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }

  /* ── Floating action buttons (right side) ── */
  #float-btns {
    position: absolute; right: 8px; bottom: 30%;
    display: flex; flex-direction: column; gap: 12px;
    z-index: 20;
  }
  .float-btn {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; border: 2px solid transparent;
    touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: pointer;
    opacity: 0.75; transition: opacity 0.1s, transform 0.04s;
  }
  .float-btn.pressed { transform: scale(0.88); opacity: 1; }
  #btn-hold { background: #1A2A42; color: #60A8E8; border-color: #1A3A5A; }
  #btn-drop { background: #1A2F1A; color: #60E870; border-color: #1A4A1A; }
  #btn-hold.pressed { background: #1E4A6A; border-color: #40A0C0; }
  #btn-drop.pressed { background: #1E5A1E; border-color: #40C040; }

  /* ── Overlay ── */
  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82);
    flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    z-index: 100;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 32px; color: #FFDD57; letter-spacing: 2px; }
  #overlay p  { font-size: 15px; color: #A0B8C8; }
  #replay-btn {
    padding: 14px 40px; border-radius: 12px; border: none;
    background: #2196F3; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer;
  }
  #replay-btn:active { opacity: 0.85; }
  #ai-tip { font-size: 14px; color: #80D8FF; margin-top: 4px; min-height: 20px; }
  #ai-recommend {
    display: none; font-size: 13px; color: #FFDD57; padding: 6px 16px;
    background: rgba(255,221,87,0.1); border-radius: 8px; margin-top: 2px;
  }
  #setup-ai-rec {
    display: none; font-size: 12px; color: #80D8FF; text-align: center;
    line-height: 1.5; padding: 8px 16px; max-width: 280px;
    background: rgba(128,216,255,0.08); border-radius: 10px;
  }
  #stats-bar {
    font-size: 12px; color: #A0B8C8; text-align: center;
    padding: 8px 12px; margin-top: 6px;
    background: rgba(160,184,200,0.08); border-radius: 10px;
    letter-spacing: 0.5px;
  }
  #stats-bar .stat-win  { color: #60E870; font-weight: bold; }
  #stats-bar .stat-lose { color: #F44336; font-weight: bold; }
  #stats-bar .stat-draw { color: #FFDD57; font-weight: bold; }
  #stats-bar .stat-rate { color: #80D8FF; }
  .stats-row { margin: 3px 0; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .stats-label { color: #5A7A90; min-width: 36px; text-align: right; }
  .stats-reset {
    background: none; border: 1px solid rgba(244,67,54,0.3); color: #F44336;
    font-size: 10px; padding: 1px 6px; border-radius: 4px; cursor: pointer;
    margin-left: 4px;
  }
  .stats-reset:active { background: rgba(244,67,54,0.2); }
</style>
</head>
<body>

<!-- Difficulty Setup -->
<div id="setup-screen">
  <h1>🎮 俄羅斯方塊 PK</h1>
  <p style="color:#5A7A90;font-size:13px;">選擇難度</p>
  <button class="diff-btn" id="btn-easy">🟢 簡單</button>
  <button class="diff-btn" id="btn-medium">🟠 普通</button>
  <button class="diff-btn" id="btn-hard">🔴 困難</button>
  <div id="setup-ai-rec"></div>
  <div id="stats-bar"></div>
  <p id="setup-hint">點擊旋轉 · 左右滑動 · 下滑落下<br>右側按鈕：⏫暫存 ⏬快速落下</p>
</div>

<!-- Game Screen -->
<div id="game-screen">
  <div id="scorebar">
    <div class="score-block">
      <div class="score-label">玩家</div>
      <div class="score-value" id="p-score">0</div>
    </div>
    <div id="diff-badge">EASY</div>
    <div id="ghost-toggle" onclick="toggleGhost()">👻</div>
    <div class="score-block">
      <div class="score-label">電腦</div>
      <div class="score-value" id="c-score">0</div>
    </div>
  </div>

  <div id="boards-area">
    <div class="board-wrap">
      <div class="board-label">玩家</div>
      <canvas id="p-canvas"></canvas>
      <div style="display:flex;gap:8px;justify-content:center;">
        <div class="hold-wrap" id="p-hold-wrap">
          <div class="hold-label">HOLD</div>
          <canvas id="p-hold"></canvas>
        </div>
        <div class="next-wrap">
          <div class="next-label">NEXT</div>
          <canvas id="p-next0"></canvas>
          <canvas id="p-next1"></canvas>
          <canvas id="p-next2"></canvas>
        </div>
      </div>
    </div>
    <div class="board-wrap">
      <div class="board-label">電腦</div>
      <canvas id="c-canvas"></canvas>
      <div class="next-wrap">
        <div class="next-label">NEXT</div>
        <canvas id="c-next0"></canvas>
        <canvas id="c-next1"></canvas>
        <canvas id="c-next2"></canvas>
      </div>
    </div>
    <!-- Transparent gesture capture layer over boards -->
    <div id="swipe-zone"></div>
    <!-- Floating action buttons (right side) -->
    <div id="float-btns">
      <button class="float-btn" id="btn-hold">⏫</button>
      <button class="float-btn" id="btn-drop">⏬</button>
    </div>
  </div>
</div>

<!-- Win/Loss Overlay -->
<div id="overlay">
  <h2 id="overlay-title">🏆 勝利！</h2>
  <p id="overlay-sub">你贏了！</p>
  <p id="overlay-stats" style="font-size:13px;color:#8FA8BA;margin-top:4px;"></p>
  <p id="ai-tip"></p>
  <div id="ai-recommend"></div>
  <button id="replay-btn">重新開始</button>
</div>

<script>
'use strict';

// ─── Constants ────────────────────────────────────────────────────────────────
const COLS = 10, ROWS = 20;
const TETROMINOES = {
  I: { shape: [[1,1,1,1]], color: '#00CFCF' },
  O: { shape: [[1,1],[1,1]], color: '#FFDD00' },
  T: { shape: [[0,1,0],[1,1,1]], color: '#CC44FF' },
  S: { shape: [[0,1,1],[1,1,0]], color: '#55DD55' },
  Z: { shape: [[1,1,0],[0,1,1]], color: '#FF5555' },
  J: { shape: [[1,0,0],[1,1,1]], color: '#4488FF' },
  L: { shape: [[0,0,1],[1,1,1]], color: '#FF8800' },
};
const PIECE_KEYS = Object.keys(TETROMINOES);
const SCORE_TABLE = [0, 100, 300, 500, 800];
const ATTACK_TABLE = [0, 0, 1, 2, 4];

const DIFF_CONFIG = {
  easy:   { fallMs: 800,  riseMs: 20000, aiDelay: 800,  aiError: 0.30 },
  medium: { fallMs: 500,  riseMs: 12000, aiDelay: 400,  aiError: 0.08 },
  hard:   { fallMs: 250,  riseMs: 7000,  aiDelay: 150,  aiError: 0.02 },
};

// DAS (Delayed Auto Shift) settings
const DAS_DELAY  = 160; // ms before repeat starts
const DAS_REPEAT = 50;  // ms between repeats

// ─── State ────────────────────────────────────────────────────────────────────
let CELL_SIZE, NEXT_CELL, cfg, gameRunning = false, ghostEnabled = true;
let pState, cState;
let lastFallP, lastFallC, lastRiseP, lastRiseC;
let animFrame;
let currentDifficulty = 'easy';
let gameStartTime = 0;

// ─── Line Clear Animations ───────────────────────────────────────────────────
// Each entry: { canvasId, row, startTime, duration }
let rowFlashEffects = [];
// Each entry: { canvasId, x, y, text, startTime, duration }
let scorePopEffects = [];

// ─── Setup Screen ─────────────────────────────────────────────────────────────
document.getElementById('btn-easy').addEventListener('click',   () => startGame('easy'));
document.getElementById('btn-medium').addEventListener('click', () => startGame('medium'));
document.getElementById('btn-hard').addEventListener('click',   () => startGame('hard'));
document.getElementById('replay-btn').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('setup-screen').style.display = 'flex';
  document.getElementById('game-screen').style.display = 'none';
  gameRunning = false;
  cancelAnimationFrame(animFrame);
  refreshStats();
});

function getStats(diff) {
  try { return JSON.parse(localStorage.getItem('tetris_stats_' + diff) || '{}'); } catch(e) { return {}; }
}
function resetStats(diff) {
  localStorage.removeItem('tetris_stats_' + diff);
  refreshStats();
}
function _addSpan(parent, text, cls) {
  const s = document.createElement('span');
  s.className = cls;
  s.textContent = text;
  parent.appendChild(s);
}
function refreshStats() {
  const bar = document.getElementById('stats-bar');
  bar.textContent = '';
  const labels = { easy: '🟢簡單', medium: '🟠普通', hard: '🔴困難' };
  let hasAny = false;
  for (const diff of ['easy', 'medium', 'hard']) {
    const st = getStats(diff);
    const total = st.total || 0;
    if (total === 0) continue;
    hasAny = true;
    const w = st.win || 0, l = st.lose || 0, rate = Math.round((w / total) * 100);
    const row = document.createElement('div');
    row.className = 'stats-row';
    _addSpan(row, labels[diff], 'stats-label');
    row.appendChild(document.createTextNode(' '));
    _addSpan(row, w + '勝', 'stat-win');
    row.appendChild(document.createTextNode(' · '));
    _addSpan(row, l + '負', 'stat-lose');
    row.appendChild(document.createTextNode(' · 勝率 '));
    _addSpan(row, rate + '%', 'stat-rate');
    row.appendChild(document.createTextNode(' · 最高 '));
    _addSpan(row, String(st.best || 0), 'stat-rate');
    const btn = document.createElement('button');
    btn.className = 'stats-reset';
    btn.textContent = '✕';
    btn.onclick = (e) => { e.stopPropagation(); resetStats(diff); };
    row.appendChild(btn);
    bar.appendChild(row);
  }
  bar.style.display = hasAny ? 'block' : 'none';
}
refreshStats();

// ─── Canvas sizing ────────────────────────────────────────────────────────────
function calcCellSize() {
  const vw = window.innerWidth;
  const boardsArea = document.getElementById('boards-area');
  const areaH = boardsArea.offsetHeight || (window.innerHeight - 120 - 10);
  const maxByWidth  = Math.floor((vw - 16 * 2 - 16) / 2 / COLS);
  const maxByHeight = Math.floor(areaH / ROWS);
  CELL_SIZE = Math.max(10, Math.min(maxByWidth, maxByHeight, 22));
  NEXT_CELL = Math.max(8, Math.floor(CELL_SIZE * 0.75));
}

function resizeCanvas(id, w, h) {
  const c = document.getElementById(id);
  c.width = w; c.height = h;
  c.style.width  = w + 'px';
  c.style.height = h + 'px';
}

function setupCanvases() {
  calcCellSize();
  resizeCanvas('p-canvas', COLS * CELL_SIZE, ROWS * CELL_SIZE);
  resizeCanvas('c-canvas', COLS * CELL_SIZE, ROWS * CELL_SIZE);
  for (let i = 0; i < NEXT_COUNT; i++) {
    resizeCanvas('p-next' + i, 4 * NEXT_CELL, 3 * NEXT_CELL);
    resizeCanvas('c-next' + i, 4 * NEXT_CELL, 3 * NEXT_CELL);
  }
  resizeCanvas('p-hold', 4 * NEXT_CELL, 4 * NEXT_CELL);
}

// ─── Game State ───────────────────────────────────────────────────────────────
function emptyBoard() {
  return Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
}

// ─── 7-Bag Randomizer ─────────────────────────────────────────────────────────
const NEXT_COUNT = 3;  // number of preview pieces
let pBag = [], cBag = [];

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function newBag() {
  return shuffleArray([...PIECE_KEYS]);
}

function spawnPiece(key) {
  const t = TETROMINOES[key];
  return {
    shape: t.shape.map(r => [...r]),
    color: t.color,
    x: Math.floor((COLS - t.shape[0].length) / 2),
    y: 0,
  };
}

function pullFromBag(bag) {
  if (bag.length === 0) bag.push(...newBag());
  return bag.shift();
}

function initState(bag) {
  bag.length = 0;
  bag.push(...newBag(), ...newBag()); // ensure enough pieces
  const piece = spawnPiece(pullFromBag(bag));
  const queue = [];
  for (let i = 0; i < NEXT_COUNT; i++) queue.push(spawnPiece(pullFromBag(bag)));
  return { board: emptyBoard(), piece, queue, hold: null, hasHeld: false, score: 0, lines: 0, combo: 0, dead: false };
}

function advanceQueue(state, bag) {
  state.piece = state.queue.shift();
  state.queue.push(spawnPiece(pullFromBag(bag)));
}

// ─── Tetris Core ──────────────────────────────────────────────────────────────
function collides(board, piece, dx, dy, shape) {
  shape = shape || piece.shape;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const nx = piece.x + c + dx;
      const ny = piece.y + r + dy;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && board[ny][nx]) return true;
    }
  }
  return false;
}

function rotateCW(shape) {
  const rows = shape.length, cols = shape[0].length;
  const newShape = [];
  for (let c = 0; c < cols; c++) {
    newShape.push([]);
    for (let r = rows - 1; r >= 0; r--) {
      newShape[c].push(shape[r][c]);
    }
  }
  return newShape;
}

function lockPiece(state, canvasId) {
  const { board, piece } = state;
  for (let r = 0; r < piece.shape.length; r++) {
    for (let c = 0; c < piece.shape[r].length; c++) {
      if (!piece.shape[r][c]) continue;
      const ny = piece.y + r;
      if (ny < 0) { state.dead = true; return 0; }
      board[ny][piece.x + c] = piece.color;
    }
  }
  // Find cleared rows before splicing (for animation)
  const clearedRows = [];
  for (let r = 0; r < ROWS; r++) {
    if (board[r].every(c => c !== null)) clearedRows.push(r);
  }
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; ) {
    if (board[r].every(c => c !== null)) {
      board.splice(r, 1);
      board.unshift(new Array(COLS).fill(null));
      cleared++;
    } else {
      r--;
    }
  }
  if (cleared > 0) {
    state.combo++;
    const multiplier = Math.pow(1.5, state.combo - 1);
    const points = Math.floor(SCORE_TABLE[cleared] * multiplier);
    state.score += points;
    state.lines += cleared;
    // Trigger animations
    const now = performance.now();
    for (const row of clearedRows) {
      rowFlashEffects.push({ canvasId, row, startTime: now, duration: 200 });
    }
    // Score popup at middle of cleared rows
    const midRow = clearedRows[Math.floor(clearedRows.length / 2)];
    scorePopEffects.push({
      canvasId,
      x: COLS * CELL_SIZE / 2,
      y: midRow * CELL_SIZE,
      text: '+' + points,
      startTime: now,
      duration: 600,
    });
  } else {
    state.combo = 0;
  }
  const bag = (state === pState) ? pBag : cBag;
  advanceQueue(state, bag);
  state.hasHeld = false;
  if (collides(state.board, state.piece, 0, 0)) {
    state.dead = true;
  }
  return cleared;
}

function hardDrop(state) {
  while (!collides(state.board, state.piece, 0, 1)) {
    state.piece.y++;
  }
}

function addGarbage(state, lines) {
  for (let i = 0; i < lines; i++) {
    const hole = Math.floor(Math.random() * COLS);
    const row = Array.from({ length: COLS }, (_, c) => c === hole ? null : '#3A3A3A');
    state.board.shift();
    state.board.push(row);
    // Push piece up with the board so it doesn't clip into garbage
    state.piece.y = Math.max(state.piece.y - 1, -2);
  }
  if (collides(state.board, state.piece, 0, 0)) {
    state.dead = true;
  }
}

function addRiseRow(state) {
  const hole = Math.floor(Math.random() * COLS);
  const row = Array.from({ length: COLS }, (_, c) => c === hole ? null : '#2A3A4A');
  state.board.shift();
  state.board.push(row);
  if (collides(state.board, state.piece, 0, 0)) {
    state.piece.y = Math.max(state.piece.y - 1, -2);
    if (collides(state.board, state.piece, 0, 0)) {
      state.dead = true;
    }
  }
}

// ─── Rendering ────────────────────────────────────────────────────────────────
function drawBoard(canvasId, state) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const cs = CELL_SIZE;

  ctx.fillStyle = '#0A1520';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#141F2A';
  ctx.lineWidth = 0.5;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.strokeRect(c * cs, r * cs, cs, cs);
    }
  }

  if (!state.dead && ghostEnabled) {
    let gy = state.piece.y;
    while (!collides(state.board, state.piece, 0, gy - state.piece.y + 1)) gy++;
    if (gy !== state.piece.y) {
      const gc = state.piece.color;
      const hr = parseInt(gc.slice(1,3),16), hg = parseInt(gc.slice(3,5),16), hb = parseInt(gc.slice(5,7),16);
      for (let r = 0; r < state.piece.shape.length; r++) {
        for (let c = 0; c < state.piece.shape[r].length; c++) {
          if (!state.piece.shape[r][c]) continue;
          const px = (state.piece.x + c) * cs;
          const py = (gy + r) * cs;
          ctx.fillStyle = 'rgba('+hr+','+hg+','+hb+',0.22)';
          ctx.fillRect(px + 1, py + 1, cs - 2, cs - 2);
          ctx.strokeStyle = 'rgba('+hr+','+hg+','+hb+',0.5)';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 1, py + 1, cs - 2, cs - 2);
        }
      }
    }
  }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!state.board[r][c]) continue;
      drawCell(ctx, c * cs, r * cs, cs, state.board[r][c]);
    }
  }

  if (!state.dead) {
    for (let r = 0; r < state.piece.shape.length; r++) {
      for (let c = 0; c < state.piece.shape[r].length; c++) {
        if (!state.piece.shape[r][c]) continue;
        const px = (state.piece.x + c) * cs;
        const py = (state.piece.y + r) * cs;
        if (py >= 0) drawCell(ctx, px, py, cs, state.piece.color);
      }
    }
  }
}

function drawCell(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x + 1, y + 1, size - 2, size - 2);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x + 1, y + 1, size - 2, 3);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(x + 1, y + size - 3, size - 2, 2);
}

function drawNextQueue(prefix, state) {
  const cs = NEXT_CELL;
  for (let i = 0; i < NEXT_COUNT; i++) {
    const canvas = document.getElementById(prefix + '-next' + i);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0A1520';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const p = state.queue[i];
    if (!p) continue;
    const shape = p.shape;
    const ox = Math.floor((4 - shape[0].length) / 2);
    const oy = Math.floor((3 - shape.length) / 2);
    const alpha = i === 0 ? 1.0 : (i === 1 ? 0.7 : 0.45);
    ctx.globalAlpha = alpha;
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        drawCell(ctx, (ox + c) * cs, (oy + r) * cs, cs, p.color);
      }
    }
    ctx.globalAlpha = 1.0;
  }
}

function drawHold(canvasId, state) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const cs = NEXT_CELL;
  ctx.fillStyle = '#0A1520';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!state.hold) return;
  const shape = state.hold.shape;
  const ox = Math.floor((4 - shape[0].length) / 2);
  const oy = Math.floor((4 - shape.length) / 2);
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      drawCell(ctx, (ox + c) * cs, (oy + r) * cs, cs, state.hold.color);
    }
  }
}

// ─── Line Clear Effects ──────────────────────────────────────────────────────
function drawEffects(canvasId, now) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const cs = CELL_SIZE;

  // Row flash: white overlay fading out over 200ms
  for (let i = rowFlashEffects.length - 1; i >= 0; i--) {
    const fx = rowFlashEffects[i];
    if (fx.canvasId !== canvasId) continue;
    const elapsed = now - fx.startTime;
    if (elapsed >= fx.duration) { rowFlashEffects.splice(i, 1); continue; }
    const alpha = 1 - elapsed / fx.duration;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.7 * alpha).toFixed(3) + ')';
    ctx.fillRect(0, fx.row * cs, COLS * cs, cs);
  }

  // Score popup: float upward + fade out over 600ms
  for (let i = scorePopEffects.length - 1; i >= 0; i--) {
    const fx = scorePopEffects[i];
    if (fx.canvasId !== canvasId) continue;
    const elapsed = now - fx.startTime;
    if (elapsed >= fx.duration) { scorePopEffects.splice(i, 1); continue; }
    const progress = elapsed / fx.duration;
    const alpha = 1 - progress;
    const offsetY = -30 * progress;
    ctx.save();
    ctx.font = 'bold ' + Math.max(12, cs) + 'px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,100,' + alpha.toFixed(3) + ')';
    ctx.shadowColor = 'rgba(255,200,0,' + (alpha * 0.8).toFixed(3) + ')';
    ctx.shadowBlur = 8;
    ctx.fillText(fx.text, fx.x, fx.y + offsetY);
    ctx.restore();
  }
}

// ─── AI ───────────────────────────────────────────────────────────────────────
function evalBoard(board) {
  let holes = 0, aggHeight = 0, bumpiness = 0;
  const heights = [];
  for (let c = 0; c < COLS; c++) {
    let h = 0;
    for (let r = 0; r < ROWS; r++) {
      if (board[r][c]) { h = ROWS - r; break; }
    }
    heights.push(h);
    aggHeight += h;
    let blocked = false;
    for (let r = 0; r < ROWS; r++) {
      if (board[r][c]) blocked = true;
      else if (blocked) holes++;
    }
  }
  for (let c = 0; c < COLS - 1; c++) {
    bumpiness += Math.abs(heights[c] - heights[c + 1]);
  }
  return aggHeight * -0.5 + holes * -30 + bumpiness * -0.3;
}

function countLinesCleared(board) {
  return board.filter(row => row.every(c => c !== null)).length;
}

function simulatePlacement(board, piece, rotation, col) {
  let shape = piece.shape;
  for (let i = 0; i < rotation; i++) shape = rotateCW(shape);
  const mock = { shape, color: piece.color, x: col, y: 0 };
  if (collides(board, mock, 0, 0)) return null;
  while (!collides(board, mock, 0, 1)) mock.y++;
  const newBoard = board.map(r => [...r]);
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const ny = mock.y + r;
      if (ny >= 0 && ny < ROWS) newBoard[ny][col + c] = piece.color;
    }
  }
  const linesCleared = countLinesCleared(newBoard);
  for (let r = ROWS - 1; r >= 0; ) {
    if (newBoard[r].every(c => c !== null)) {
      newBoard.splice(r, 1);
      newBoard.unshift(new Array(COLS).fill(null));
    } else r--;
  }
  return { score: evalBoard(newBoard) + linesCleared * 100, lines: linesCleared, col, rotation, shape, y: mock.y };
}

function getAIMove(state) {
  const { board, piece } = state;
  let best = null;
  for (let rot = 0; rot < 4; rot++) {
    let shape = piece.shape;
    for (let i = 0; i < rot; i++) shape = rotateCW(shape);
    for (let col = -1; col < COLS; col++) {
      const result = simulatePlacement(board, { shape: piece.shape, color: piece.color }, rot, col);
      if (!result) continue;
      if (!best || result.score > best.score) best = result;
    }
  }
  return best;
}

let aiTimer = null;
let aiTargetMove = null;

function scheduleAI() {
  if (aiTimer) return;
  aiTimer = setTimeout(() => {
    aiTimer = null;
    if (!gameRunning || cState.dead) return;
    if (Math.random() < cfg.aiError) {
      const rots = Math.floor(Math.random() * 4);
      for (let i = 0; i < rots; i++) {
        const rotated = rotateCW(cState.piece.shape);
        if (!collides(cState.board, cState.piece, 0, 0, rotated)) {
          cState.piece.shape = rotated;
        }
      }
      const dir = Math.random() < 0.5 ? -1 : 1;
      if (!collides(cState.board, cState.piece, dir, 0)) cState.piece.x += dir;
      aiTargetMove = null;
    } else {
      aiTargetMove = getAIMove(cState);
    }
  }, cfg.aiDelay + Math.random() * 100);
}

function stepAI() {
  if (!aiTargetMove) { scheduleAI(); return; }
  const move = aiTargetMove;
  const piece = cState.piece;
  const currentRot = getRotationCount(piece.shape, move.shape);
  if (currentRot > 0) {
    const rotated = rotateCW(piece.shape);
    if (!collides(cState.board, piece, 0, 0, rotated)) piece.shape = rotated;
    return;
  }
  if (piece.x < move.col) {
    if (!collides(cState.board, piece, 1, 0)) piece.x++;
    return;
  }
  if (piece.x > move.col) {
    if (!collides(cState.board, piece, -1, 0)) piece.x--;
    return;
  }
  hardDrop(cState);
  aiTargetMove = null;
}

function getRotationCount(current, target) {
  if (shapeEquals(current, target)) return 0;
  let s = current;
  for (let i = 1; i <= 3; i++) {
    s = rotateCW(s);
    if (shapeEquals(s, target)) return i;
  }
  return 0;
}

function shapeEquals(a, b) {
  if (a.length !== b.length) return false;
  for (let r = 0; r < a.length; r++) {
    if (a[r].length !== b[r].length) return false;
    for (let c = 0; c < a[r].length; c++) {
      if (a[r][c] !== b[r][c]) return false;
    }
  }
  return true;
}

// ─── Game Loop ────────────────────────────────────────────────────────────────
function startGame(difficulty) {
  cfg = DIFF_CONFIG[difficulty];
  currentDifficulty = difficulty;
  gameStartTime = Date.now();
  document.getElementById('diff-badge').textContent = difficulty.toUpperCase();
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('game-screen').style.display  = 'flex';

  setupCanvases();

  pState = initState(pBag);
  cState = initState(cBag);
  rowFlashEffects = [];
  scorePopEffects = [];
  aiTargetMove = null;
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  gameRunning = true;

  const now = performance.now();
  lastFallP = now; lastFallC = now;
  lastRiseP = now; lastRiseC = now;

  cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(loop);
}

function loop(now) {
  if (!gameRunning) return;

  if (now - lastFallP >= cfg.fallMs) {
    lastFallP = now;
    if (!collides(pState.board, pState.piece, 0, 1)) {
      pState.piece.y++;
    } else {
      const cleared = lockPiece(pState, 'p-canvas');
      if (cleared > 0 && ATTACK_TABLE[cleared] > 0) addGarbage(cState, ATTACK_TABLE[cleared]);
    }
  }

  if (now - lastFallC >= cfg.fallMs) {
    lastFallC = now;
    stepAI();
    if (!collides(cState.board, cState.piece, 0, 1)) {
      cState.piece.y++;
    } else {
      const cleared = lockPiece(cState, 'c-canvas');
      if (cleared > 0 && ATTACK_TABLE[cleared] > 0) addGarbage(pState, ATTACK_TABLE[cleared]);
      aiTargetMove = null;
      if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    }
  }

  if (now - lastRiseP >= cfg.riseMs) {
    lastRiseP = now;
    if (!pState.dead) addRiseRow(pState);
  }
  if (now - lastRiseC >= cfg.riseMs) {
    lastRiseC = now;
    if (!cState.dead) addRiseRow(cState);
  }

  document.getElementById('p-score').textContent = pState.score;
  document.getElementById('c-score').textContent = cState.score;

  drawBoard('p-canvas', pState);
  drawBoard('c-canvas', cState);
  drawEffects('p-canvas', now);
  drawEffects('c-canvas', now);
  drawNextQueue('p', pState);
  drawNextQueue('c', cState);
  drawHold('p-hold', pState);
  // Update hold wrap opacity based on hasHeld flag
  const holdWrap = document.getElementById('p-hold-wrap');
  if (holdWrap) holdWrap.classList.toggle('used', pState.hasHeld);

  if (pState.dead || cState.dead) {
    gameRunning = false;
    showResult();
    return;
  }

  animFrame = requestAnimationFrame(loop);
}

function showResult() {
  const overlay = document.getElementById('overlay');
  const title   = document.getElementById('overlay-title');
  const sub     = document.getElementById('overlay-sub');
  const aiTip   = document.getElementById('ai-tip');
  const aiRec   = document.getElementById('ai-recommend');
  let result = 'lose';
  if (pState.dead && cState.dead) {
    title.textContent = '🤝 平手！';
    sub.textContent   = `雙方分數：你 ${pState.score} vs 電腦 ${cState.score}`;
    result = 'draw';
  } else if (cState.dead) {
    title.textContent = '🏆 你贏了！';
    sub.textContent   = `你的分數：${pState.score}　電腦：${cState.score}`;
    result = 'win';
  } else {
    title.textContent = '💀 電腦勝利';
    sub.textContent   = `你的分數：${pState.score}　電腦：${cState.score}`;
  }
  // Save game history and request AI suggestion
  aiTip.textContent = '';
  aiRec.textContent = '';
  aiRec.style.display = 'none';
  saveGameAndRequestSuggestion(result);
  // Show updated per-difficulty stats on overlay
  try {
    const diffLabel = { easy: '簡單', medium: '普通', hard: '困難' }[currentDifficulty] || '';
    const st = getStats(currentDifficulty);
    const t = st.total || 0;
    if (t > 0) {
      const r = Math.round(((st.win||0) / t) * 100);
      document.getElementById('overlay-stats').textContent =
        `${diffLabel} 戰績 ${st.win||0}勝 ${st.lose||0}負 · 勝率 ${r}%`;
    }
  } catch(e) {}
  overlay.classList.add('show');
}

function saveGameAndRequestSuggestion(result) {
  const record = {
    score: pState.score,
    lines: pState.lines,
    duration_sec: Math.round((Date.now() - gameStartTime) / 1000),
    level: currentDifficulty,
    result: result,
    timestamp: new Date().toISOString(),
  };
  // Load history from localStorage, keep last 5 for AI suggestion
  let history = [];
  try { history = JSON.parse(localStorage.getItem('tetris_history') || '[]'); } catch(e) {}
  history.unshift(record);
  if (history.length > 5) history = history.slice(0, 5);
  localStorage.setItem('tetris_history', JSON.stringify(history));

  // Update per-difficulty stats
  const statsKey = 'tetris_stats_' + currentDifficulty;
  let stats = { win: 0, lose: 0, draw: 0, best: 0, total: 0 };
  try { stats = JSON.parse(localStorage.getItem(statsKey) || '{}'); } catch(e) {}
  stats.win  = (stats.win  || 0) + (result === 'win'  ? 1 : 0);
  stats.lose = (stats.lose || 0) + (result === 'lose' ? 1 : 0);
  stats.draw = (stats.draw || 0) + (result === 'draw' ? 1 : 0);
  stats.total = (stats.total || 0) + 1;
  if (pState.score > (stats.best || 0)) stats.best = pState.score;
  localStorage.setItem(statsKey, JSON.stringify(stats));

  // Call bridge API for AI suggestion
  if (history.length < 2) return; // need at least 2 games for meaningful suggestion
  fetch('http://127.0.0.1:8765/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task: 'game_difficulty_suggest', history: history }),
  })
  .then(r => r.json())
  .then(data => {
    if (data.success && data.result) {
      const r = data.result;
      const aiTip = document.getElementById('ai-tip');
      const aiRec = document.getElementById('ai-recommend');
      const setupRec = document.getElementById('setup-ai-rec');
      // Show encouragement on overlay
      aiTip.textContent = r.encouragement || '';
      // Show recommended level
      const levelMap = { easy: '🟢 簡單', medium: '🟠 普通', hard: '🔴 困難' };
      const recText = `AI 建議：${levelMap[r.recommended_level] || r.recommended_level}`;
      aiRec.textContent = recText;
      aiRec.style.display = 'block';
      // Also show on setup screen
      if (setupRec) {
        setupRec.textContent = `${recText}（${r.reason || ''}）`;
        setupRec.style.display = 'block';
      }
    }
  })
  .catch(() => {}); // silently fail — game works without AI
}

// ─── Player Action Functions ───────────────────────────────────────────────────
function playerLeft() {
  if (!gameRunning || pState.dead) return;
  if (!collides(pState.board, pState.piece, -1, 0)) pState.piece.x--;
}
function playerRight() {
  if (!gameRunning || pState.dead) return;
  if (!collides(pState.board, pState.piece, 1, 0)) pState.piece.x++;
}
function playerRotate() {
  if (!gameRunning || pState.dead) return;
  const rotated = rotateCW(pState.piece.shape);
  for (const kick of [0, -1, 1, -2, 2]) {
    if (!collides(pState.board, { ...pState.piece, shape: rotated }, kick, 0)) {
      pState.piece.shape = rotated;
      pState.piece.x += kick;
      return;
    }
  }
}
function playerDown() {
  if (!gameRunning || pState.dead) return;
  if (!collides(pState.board, pState.piece, 0, 1)) {
    pState.piece.y++;
    lastFallP = performance.now();
  }
}
function playerDrop() {
  if (!gameRunning || pState.dead) return;
  hardDrop(pState);
  // Immediately lock — don't wait for next loop tick
  const cleared = lockPiece(pState, 'p-canvas');
  if (cleared > 0 && ATTACK_TABLE[cleared] > 0) addGarbage(cState, ATTACK_TABLE[cleared]);
  lastFallP = performance.now();
}
function playerHold() {
  if (!gameRunning || pState.dead || pState.hasHeld) return;
  pState.hasHeld = true;
  if (pState.hold) {
    // Swap current piece with held piece
    const held = pState.hold;
    pState.hold = { shape: pState.piece.shape, color: pState.piece.color };
    pState.piece = {
      shape: held.shape,
      color: held.color,
      x: Math.floor((COLS - held.shape[0].length) / 2),
      y: 0,
    };
  } else {
    // First hold: store current, advance queue
    pState.hold = { shape: pState.piece.shape, color: pState.piece.color };
    advanceQueue(pState, pBag);
  }
  // Update hold visual state
  const wrap = document.getElementById('p-hold-wrap');
  if (wrap) wrap.classList.toggle('used', pState.hasHeld);
  lastFallP = performance.now();
}

// ─── Haptic feedback helper ───────────────────────────────────────────────────
function vibrate(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {}
}

// ─── Button Controls with DAS ─────────────────────────────────────────────────
// DAS = Delayed Auto Shift: hold a button → wait DAS_DELAY ms → repeat every DAS_REPEAT ms
function makeDasBtn(btnId, action) {
  const btn = document.getElementById(btnId);
  let dasTimeout = null;
  let dasInterval = null;
  let usedTouch = false;

  function start(e) {
    if (e.type === 'touchstart') usedTouch = true;
    if (e.type === 'mousedown' && usedTouch) return;
    e.preventDefault();
    btn.classList.add('pressed');
    vibrate(10);
    action();
    dasTimeout = setTimeout(() => {
      dasInterval = setInterval(() => { action(); vibrate(5); }, DAS_REPEAT);
    }, DAS_DELAY);
  }

  function stop() {
    btn.classList.remove('pressed');
    clearTimeout(dasTimeout);
    clearInterval(dasInterval);
    dasTimeout = null;
    dasInterval = null;
  }

  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend',   stop);
  btn.addEventListener('touchcancel',stop);
  // Mouse fallback
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup',   stop);
  btn.addEventListener('mouseleave',stop);
}

function makeTapBtn(btnId, action) {
  const btn = document.getElementById(btnId);
  let lastTap = 0;
  let usedTouch = false;
  function start(e) {
    // Prevent mouse events from firing after touch (double-trigger on mobile)
    if (e.type === 'touchstart') usedTouch = true;
    if (e.type === 'mousedown' && usedTouch) return;
    e.preventDefault();
    // Debounce: ignore taps within 120ms of previous
    const now = performance.now();
    if (now - lastTap < 120) return;
    lastTap = now;
    btn.classList.add('pressed');
    vibrate(15);
    action();
  }
  function stop() { btn.classList.remove('pressed'); }
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend',   stop);
  btn.addEventListener('touchcancel',stop);
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup',   stop);
  btn.addEventListener('mouseleave',stop);
}

makeTapBtn('btn-hold',  playerHold);
makeTapBtn('btn-drop',  playerDrop);

// ─── Swipe Zone Gesture Controls ──────────────────────────────────────────────
// The swipe-zone div covers the boards-area.
// - Tap (< 15px movement, < 300ms)  → rotate
// - Horizontal drag                  → move left/right, snapped by approx cell width
// - Quick flick down (fast, >80px)   → hard drop (only if soft drop was NOT active)
// - Hold & drag down (slow/long)     → soft drop (continuous while holding)
(function () {
  const zone = document.getElementById('swipe-zone');

  let startX, startY, startTime;
  let lastProcessedX;      // tracks how far we've already moved
  let softDropTimer = null;
  let isSoftDropActive = false;
  let hasMoved = false;    // true if any horizontal/vertical movement was triggered
  const CELL_PX = () => CELL_SIZE || 18; // pixel width per column on board

  function stopSoftDrop() {
    if (softDropTimer) { clearInterval(softDropTimer); softDropTimer = null; }
    isSoftDropActive = false;
  }

  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    startX = lastProcessedX = t.clientX;
    startY = t.clientY;
    startTime = performance.now();
    isSoftDropActive = false;
    hasMoved = false;
  }, { passive: false });

  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!gameRunning || pState.dead) return;
    const t = e.touches[0];
    const curX = t.clientX;
    const curY = t.clientY;
    const totalDy = curY - startY;
    const totalDx = Math.abs(curX - startX);

    // Determine primary direction: if horizontal drag dominates, don't soft drop
    const isHorizontalDrag = totalDx > Math.abs(totalDy) * 0.7;

    // Horizontal: move by columns based on drag distance
    const dx = curX - lastProcessedX;
    const colW = CELL_PX();
    if (Math.abs(dx) >= colW) {
      const steps = Math.trunc(dx / colW);
      for (let i = 0; i < Math.abs(steps); i++) {
        if (steps > 0) playerRight();
        else           playerLeft();
      }
      lastProcessedX += steps * colW;
      hasMoved = true;
      vibrate(5);
    }

    // Vertical: start soft drop if dragging down more than 2 rows
    // Only activate if not primarily horizontal dragging
    if (!isHorizontalDrag && totalDy > CELL_PX() * 2 && !isSoftDropActive) {
      isSoftDropActive = true;
      hasMoved = true;
      vibrate(10);
      playerDown();
      softDropTimer = setInterval(playerDown, 60);
    }
  }, { passive: false });

  zone.addEventListener('touchend', e => {
    e.preventDefault();
    const wasSoftDrop = isSoftDropActive;
    stopSoftDrop();
    if (!gameRunning || pState.dead) return;

    const t = e.changedTouches[0];
    const dx = Math.abs(t.clientX - startX);
    const dy = t.clientY - startY;
    const dt = performance.now() - startTime;

    // Quick upward flick → hold piece
    if (!wasSoftDrop && dy < -60 && dx < 40 && dt < 400) {
      vibrate(20);
      playerHold();
      return;
    }

    // Quick downward flick → hard drop
    // Criteria: mostly downward, fast gesture, was NOT soft-dropping
    // This prevents accidental hard drop after releasing a soft drop
    if (!wasSoftDrop && dy > 80 && dx < 40 && dt < 300) {
      vibrate(25);
      playerDrop();
      return;
    }

    // Tap → rotate
    // Criteria: barely moved AND short time AND no movement was triggered
    if (!hasMoved && dx < 15 && Math.abs(dy) < 15 && dt < 300) {
      vibrate(10);
      playerRotate();
    }
  }, { passive: false });

  zone.addEventListener('touchcancel', () => stopSoftDrop());
})();

// ─── Ghost Toggle ────────────────────────────────────────────────────────
function toggleGhost() {
  ghostEnabled = !ghostEnabled;
  document.getElementById('ghost-toggle').classList.toggle('off', !ghostEnabled);
  vibrate(10);
}

// ─── Keyboard ─────────────────────────────────────────────────────────────────
const keyHeld = {};
document.addEventListener('keydown', e => {
  if (keyHeld[e.key]) return; // handled by repeat
  keyHeld[e.key] = true;
  switch (e.key) {
    case 'ArrowLeft':  playerLeft();   break;
    case 'ArrowRight': playerRight();  break;
    case 'ArrowUp':    playerRotate(); break;
    case 'ArrowDown':  playerDown();   break;
    case ' ':          playerDrop();   break;
    case 'c': case 'C': case 'Shift': playerHold(); break;
  }
});
document.addEventListener('keyup', e => { keyHeld[e.key] = false; });
